# 每日全量 vitest 套件（~1400 文件 / ~14600 用例，本机 62 分钟、CI 预计 1-2.5 小时；
# 2026-11-20 起 apps/zcode-vscode 单测经 vitest.config.ts 的 vscode-ext project 纳入），
# 时长不适合挂每次 push——push 级门禁由 ci.yml 的三包 node:test + 扩展 vitest 步骤承担。
# 另挂扩展包 mock 全链路 E2E（本地 Mock 模型，无外部依赖，~2 分钟）：真实 server +
# CLI bundle + WS accessor 的端到端面，与 unit job 分开跑、失败互不影响。
# 手动触发：gh workflow run unit-nightly.yml --ref <branch>
name: Unit Nightly

on:
  schedule:
    # 03:00 Asia/Shanghai（UTC 19:00 前一日）
    - cron: "0 19 * * *"
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests (full vitest suite)
        run: pnpm test:unit

  e2e-mock-full:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # E2E 前置：server entry-http.js（cli-bundle 与 mock fixtures 均已入库）
      - name: Build server bundle
        run: pnpm --filter @zcode/server build

      - name: VS Code extension mock-model E2E (full chain)
        run: pnpm --filter gode test:e2e
