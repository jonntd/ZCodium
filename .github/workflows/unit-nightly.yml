# 每日全量 vitest 套件（~1400 文件 / ~14600 用例，本机 62 分钟、CI 预计 1-2.5 小时），
# 时长不适合挂每次 push——push 级门禁由 ci.yml 的三包 node:test 步骤承担。
# 手动触发：gh workflow run unit-nightly.yml --ref <branch>
name: Unit Nightly

on:
  schedule:
    # 03:00 Asia/Shanghai（UTC 19:00 前一日）
    - cron: "0 19 * * *"
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests (full vitest suite)
        run: pnpm test:unit
