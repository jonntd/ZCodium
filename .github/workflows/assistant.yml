# 在 issue / PR 评论中输入 /oc 触发助手。
# 仅仓库协作者（OWNER/MEMBER/COLLABORATOR）的评论会启动工作流，内部还会再做一次 admin/write 权限校验。
# 使用 GITHUB_TOKEN 模式，评论与 PR 均以 github-actions[bot] 身份发出。
name: assistant

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  assistant:
    if: |
      (startsWith(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, ' /oc')) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write # 供 action 内置缓存使用
    steps:
      # GITHUB_TOKEN 模式下 action 不会自行配置 git 凭据，依赖 checkout 默认保留凭据（persist-credentials: true）
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # GITHUB_TOKEN 模式下 action 不设置提交身份，这里显式配置以便提交改动
      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # GITHUB_TOKEN 无权推送 .github/workflows 变更（GitHub 硬性限制），提交里混入这类文件会导致 push 整体被拒；
      # 安装 pre-commit hook 在提交时剥离这些变更，保证 agent 的其他改动可正常推送。
      - name: Strip workflow-file changes from commits
        run: |
          mkdir -p .git/hooks
          cat > .git/hooks/pre-commit <<'HOOK'
          #!/usr/bin/env bash
          set -euo pipefail
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo "[pre-commit] 检测到 .github/workflows 变更，GITHUB_TOKEN 无权推送，已从本次提交移除："
            git diff --cached --name-only -- '.github/workflows/'
            git restore --staged -- '.github/workflows/'
          fi
          HOOK
          chmod +x .git/hooks/pre-commit

      - name: Run assistant
        uses: anomalyco/opencode/github@latest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # CI 无人应答权限询问，opencode 会因此永久挂起；这里预先放行工具权限。
          # question 保持 deny，避免 agent 向无人应答的 CI 环境提问。
          OPENCODE_PERMISSION: '{"*":"allow","question":"deny","doom_loop":"allow","external_directory":"allow"}'
        with:
          model: deepseek/deepseek-flash
          use_github_token: true
          share: false
          mentions: /oc
