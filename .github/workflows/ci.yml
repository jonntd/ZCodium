# 推送到任意分支时自动编译（typecheck）并跑锚点单测。
# 不触发发布；产物构建仍由 release.yml 手动触发。
name: CI

on:
  push:
  workflow_dispatch:

jobs:
  compile:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # 包级 node:test 单测：vitest.config.ts 的 nodeRunTestFiles 排除名单里的 node:test
      # 文件（各包自己的 test 脚本执行，脚本按 `from "node:test"` import 动态圈定，与
      # vitest 排除名单同源判定）。2026-10-24 修复前各包脚本用 test/*.test.ts 全量 glob，
      # 会把 138+ 个 vitest 风格用例塞进 node:test 跑挂（结构性跑不通）；修复后三包
      # 159 用例全绿（shared 49 / services 18 / ui 92，含无遥测守卫），接入 CI。
      # ui/test 其余 942 个 vitest 风格用例仍属根 vitest 套件，接入是后续事项。
      - name: Unit tests (node:test packages)
        run: pnpm --filter @zcode/shared --filter @zcode/services --filter @zcode/ui test