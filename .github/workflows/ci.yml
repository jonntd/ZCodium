# 推送到任意分支时自动编译（typecheck）并跑锚点单测。
# 不触发发布；产物构建仍由 release.yml 手动触发。
name: CI

on:
  push:
  workflow_dispatch:

jobs:
  compile:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # 锚点单测：vitest.config.ts 的 nodeRunTestFiles 排除名单里的 node:test 文件原本
      # 不在任何自动关卡里（各包 test 脚本存量有坏：shared 的 vitest 互操作 138 挂），
      # 只能把逐个验证过绿的关键回归锚点接进 CI，修好存量后再逐步扩到全量。
      # 锚点 2 是无遥测守卫：源码扫描断言，曾在 2026-10-20 上游同步带回
      # processResourceTelemetry 能力位时静默失守（当时无任何关卡跑它），接入后
      # 未来上游同步再带回遥测入口会被 CI 直接拦下。
      - name: Unit tests (regression anchors)
        run: |
          cd packages/ui
          TSX_TSCONFIG_PATH=tsconfig.json node --import tsx --test test/chatLoadingVisibility.test.ts
          node --import tsx --test tests/no-telemetry.test.mjs