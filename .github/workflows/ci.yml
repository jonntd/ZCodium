# 推送到任意分支时自动编译（typecheck）并跑锚点单测。
# 不触发发布；产物构建仍由 release.yml 手动触发。
name: CI

on:
  push:
  workflow_dispatch:

jobs:
  compile:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # 锚点单测：vitest.config.ts 的 nodeRunTestFiles 排除名单里的 node:test 文件原本
      # 不在任何自动关卡里（各包 test 脚本存量有坏：shared 的 vitest 互操作 138 挂、
      # ui tests/*.mjs 的 no-telemetry 存量断言挂），只能先把逐个验证过绿的关键回归
      # 锚点接进 CI，修好存量后再逐步扩到全量。
      - name: Unit tests (regression anchors)
        run: |
          cd packages/ui
          TSX_TSCONFIG_PATH=tsconfig.json node --import tsx --test test/chatLoadingVisibility.test.ts