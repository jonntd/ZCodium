# ZCode VPS 中继 —— 用**已发布镜像**部署（有域名 + Caddy 终结 TLS 的变体）。
#
# 与 docker-compose.yml 的差别：不 build、不 bind mount web/，直接用 CI 推上来的镜像，
# 因此「镜像 tag = 手机页版本」，升级只要 pull。
#
# 用法：
#   cp .env.example .env && 填入两个密钥
#   RELAY_VERSION=v3.14.11 docker compose -f docker-compose.image.yml up -d
#
# 仓库是公开的 ⇒ 从 ghcr.io 拉取**不需要** docker login。
# 只把端口绑在 127.0.0.1，由宿主机的 Caddy 做 TLS 终结与反代（见 Caddyfile）。

services:
  relay:
    # 不写 tag 就是 :latest（每次发布都推，含预发布 ⇒ 可能指向 audit 产物）。
    # 生产建议钉死具体版本，避免意外跟着 latest 走。
    image: ghcr.io/jonntd/zcode-relay:${RELAY_VERSION:-latest}
    restart: unless-stopped
    ports:
      # 只在回环上监听：公网流量必须经 Caddy 进来（TLS + 统一入口）。
      - "127.0.0.1:3180:3180"
    environment:
      # :? 语法让 compose 在变量缺失时直接报错退出，避免用空密钥起服务。
      RELAY_TOKEN: ${RELAY_TOKEN:?RELAY_TOKEN 未设置，请先填 .env}
      HOST_SECRET: ${HOST_SECRET:?HOST_SECRET 未设置，请先填 .env}
      PORT: "3180"
      WEB_ROOT: /app/web
    security_opt:
      - no-new-privileges:true
    # 纯转发、几乎不耗 CPU；给个上限防止异常时打满宿主机。
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
