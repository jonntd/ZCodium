# ZCode VPS 中继 —— **无域名（纯 IP）**部署变体
#
# 用法：
#   mkdir -p web && cp -r <repo>/packages/web/dist/* web/
#   printf 'RELAY_TOKEN=%s\nHOST_SECRET=%s\n' "$(openssl rand -base64 32)" "$(openssl rand -base64 32)" > .env
#   chmod 600 .env
#   docker compose -f docker-compose.no-tls.yml up -d --build
#
# 与 docker-compose.yml（有域名 + Caddy）的差别只有两点：
#   1. 端口绑 0.0.0.0:3180，直接对外（仓库版绑 127.0.0.1，公网流量经 Caddy 进来）；
#   2. 不启 Caddy —— 没有域名就签不到受信任证书（公共 CA 基本不给裸 IP 签发）。
#
# ⚠ 安全性见 spec §16 与 README §2.5：这个变体是**明文 http**：
#   - 内容仍受 E2EE 保护（端到端加密，中继只转发密文）；
#   - 丢的是**页面完整性**（bundle 在链路上可被主动篡改，而它读得到 `#k=`）
#     与 insecure origin 的浏览器能力（crypto.subtle / randomUUID / clipboard）。
#   只在能接受这两条时使用；否则请上域名 + Caddy（docker-compose.yml）。

services:
  relay:
    build: .
    image: zcode-vps-relay:local
    restart: unless-stopped
    ports:
      # 直接对外监听：没有反代，relay 自己就是入口。
      - "3180:3180"
    environment:
      # :? 语法让 compose 在变量缺失时直接报错退出，避免用空密钥起服务。
      RELAY_TOKEN: ${RELAY_TOKEN:?RELAY_TOKEN 未设置，请先填 .env}
      HOST_SECRET: ${HOST_SECRET:?HOST_SECRET 未设置，请先填 .env}
      PORT: "3180"
      WEB_ROOT: /app/web
    volumes:
      # web bundle 只读挂载：更新前端只需替换 web/ 内容并 restart，不用重建镜像。
      - ./web:/app/web:ro
    security_opt:
      - no-new-privileges:true
    # 纯转发、几乎不耗 CPU；给个上限防止异常时打满宿主机。
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
