# ZCode VPS 中继 —— 用**已发布镜像**部署（**无域名 / 纯 IP** 变体）。
#
# 与 docker-compose.image.yml 的差别只有两点：端口直接对外、不启 Caddy。
# 与 docker-compose.no-tls.yml 的差别：不 build、不 bind mount web/，直接用已发布镜像。
#
# 用法：
#   cp .env.example .env && 填入两个密钥
#   RELAY_VERSION=v3.14.11 docker compose -f docker-compose.image.no-tls.yml up -d
#
# 仓库是公开的 ⇒ 从 ghcr.io 拉取**不需要** docker login。
#
# ⚠ 安全性见 spec §16 与 README §2.5：这个变体是**明文 http**：
#   - 内容仍受 E2EE 保护（端到端加密，中继只转发密文）；
#   - 丢的是**页面完整性**（bundle 在链路上可被主动篡改，而它读得到 `#k=`）
#     与 insecure origin 的浏览器能力（crypto.subtle / randomUUID / clipboard）。
#   只在能接受这两条时使用；否则请上域名 + Caddy（docker-compose.image.yml）。

services:
  relay:
    # 不写 tag 就是 :latest（每次发布都推，含预发布 ⇒ 可能指向 audit 产物）。
    # 生产建议钉死具体版本，避免意外跟着 latest 走。
    image: ghcr.io/jonntd/zcode-relay:${RELAY_VERSION:-latest}
    restart: unless-stopped
    ports:
      # 直接对外监听：没有反代，relay 自己就是入口。
      - "3180:3180"
    environment:
      # :? 语法让 compose 在变量缺失时直接报错退出，避免用空密钥起服务。
      RELAY_TOKEN: ${RELAY_TOKEN:?RELAY_TOKEN 未设置，请先填 .env}
      HOST_SECRET: ${HOST_SECRET:?HOST_SECRET 未设置，请先填 .env}
      PORT: "3180"
      WEB_ROOT: /app/web
    security_opt:
      - no-new-privileges:true
    # 纯转发、几乎不耗 CPU；给个上限防止异常时打满宿主机。
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
